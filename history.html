<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ประวัติการสุ่มอาหาร</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:linear-gradient(135deg,#5e0000,#1a0000);
    color:white;
}

.header{
    text-align:center;
    padding:40px 0 20px 0;
    font-size:32px;
    font-weight:bold;
}

.history-container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:20px;
}

.history-card{
    width:100%;
    background:rgba(255,255,255,0.08);
    border-radius:15px;
    padding:18px;
    margin-bottom:20px;
    display:flex;
    align-items:center;
    gap:18px;
}

.history-card img{
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:12px;
    border:2px solid #ff2e2e;
}

.food-info{
    flex:1;
}

.food-info h3{
    margin:0;
}

.food-info p{
    margin:5px 0 0 0;
    color:#ffae00;
}

.button-group{
    text-align:center;
    margin:40px 0;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin:10px;
}

.clear-btn{
    background:#ff2e2e;
    color:white;
}

.back-btn{
    background:#444;
    color:white;
}
</style>
</head>

<body>

<div class="header">📜 ประวัติการสุ่มอาหาร</div>

<div class="history-container" id="historyList"></div>

<div class="button-group">
    <button class="clear-btn" onclick="clearHistory()">ล้างประวัติ</button>
    <button class="back-btn" onclick="goBack()">กลับหน้าแรก</button>
</div>

<script>

function loadHistory() {

    let history = JSON.parse(localStorage.getItem("foodHistory")) || [];
    let list = document.getElementById("historyList");
    list.innerHTML = "";

    if(history.length === 0){
        list.innerHTML = "<p style='text-align:center;'>ยังไม่มีประวัติการสุ่ม</p>";
        return;
    }

    history.slice().reverse().forEach(item => {

        let card = document.createElement("div");
        card.className = "history-card";

        card.innerHTML = `
            <img src="${item.img}" onerror="this.src='https://via.placeholder.com/90?text=No+Image'">
            <div class="food-info">
                <h3>${item.name}</h3>
                <p>🔥 ${item.cal} kcal</p>
            </div>
        `;

        list.appendChild(card);
    });
}

function clearHistory(){
    localStorage.removeItem("foodHistory");
    loadHistory();
}

function goBack(){
    window.location.href = "main.html";
}

window.onload = loadHistory;

</script>

</body>
</html>
